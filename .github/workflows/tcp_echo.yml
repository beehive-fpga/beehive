name: Test TCP echo

on:
  schedule:
    - cron: '0 0 * * *'  # Runs every day at midnight
  workflow_dispatch:

jobs:
  test-tcp-echo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 
        with:
          path: beehive
          submodules: recursive

      - name: Setup Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Setup dependencies
        run: |
          ./beehive/ci/dependencies.sh
          ./beehive/ci/verilator_deps.sh

      - name: Restore verilator
        uses: actions/cache/restore@v3
        id: cache
        with:
          path: verilator
          key: verilator
      
      - name: Check cache hit
        if: steps.cache.outputs.cache-hit != 'true'
        uses: ./beehive/.github/actions/build_verilator

      - name: Setup environment variables
        run: |
          echo "VERILATOR_ROOT=${PWD}/verilator" >> $GITHUB_ENV
          echo "PATH=${PWD}/verilator/bin:$PATH" >> $GITHUB_ENV
          echo "SIM=verilator" >> $GITHUB_ENV
      
      - name: Run experiment
        run: |
          cd beehive
          source settings.sh
          cd sample_designs/tcp_echo
          export SIM=verilator
          make init_fusesoc
          make gen_filelist
          make 
        